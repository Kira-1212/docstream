services:
  postgres:
    image: postgres:16-alpine
    container_name: docstream-postgres
    environment:
      POSTGRES_DB: docstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: docstream-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docstream
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: